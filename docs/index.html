<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akcie Trnava</title>
<meta name="theme-color" content="#09080f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f2fa" media="(prefers-color-scheme: light)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Akcie">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #f3f2fa; --card: #ffffff; --raised: #ebe9f7; --ink: #171433; --muted: #5e5a86; --line: #dddbee;
  --accent: #4b2fb8; --accent-soft: #e9e4ff; --on-accent: #ffffff;
  --sale: #cf3f2c; --sale-soft: #fde4e0;
  --tesco: #d6202f; --billa: #a06e00; --lidl: #0050aa; --watch: #a06e00; --watch-soft: #fff1cc;
  --display: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --tabs-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #09080f; --card: #14121f; --raised: #1d1a2e; --ink: #ecebf5; --muted: #8f8cad; --line: #26233a;
    --accent: #8b6cff; --accent-soft: #231c45; --on-accent: #ffffff;
    --sale: #ff7466; --sale-soft: #33181b;
    --tesco: #ff6b6b; --billa: #f4c152; --lidl: #5aa2ff; --watch: #f4c152; --watch-soft: #2c2412;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 var(--body); -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
header { position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  padding: calc(env(safe-area-inset-top) + 12px) 16px 10px; }
h1 { margin: 0; font: 800 30px/1.1 var(--display); letter-spacing: -0.02em; }
.sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.sname { font-weight: 700; }
.search { width: 100%; margin-top: 12px; padding: 12px 16px; border-radius: 14px; border: 1px solid transparent;
  background: var(--raised); font-size: 16px; outline: none; }
.search:focus { border-color: var(--accent); }
.search::placeholder { color: var(--muted); }
.row { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 14px; border-radius: 999px; border: 0; background: var(--raised);
  font-size: 14px; font-weight: 600; white-space: nowrap; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.sname.Tesco, .shopchip.Tesco { color: var(--tesco); }
.sname.Billa, .shopchip.Billa { color: var(--billa); }
.sname.Lidl, .shopchip.Lidl { color: var(--lidl); }
.shopchip.Tesco[aria-pressed="true"] { background: var(--tesco); color: #fff; }
.shopchip.Billa[aria-pressed="true"] { background: var(--billa); color: #1a1405; }
.shopchip.Lidl[aria-pressed="true"] { background: var(--lidl); color: #fff; }
select.chip { appearance: none; -webkit-appearance: none; padding-right: 30px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
main { padding: 4px 16px calc(env(safe-area-inset-bottom) + var(--tabs-h) + 24px); max-width: 720px; margin: 0 auto; }
.notice { background: var(--watch-soft); border-radius: 14px; padding: 12px 14px; font-size: 14px; margin: 6px 0 4px; }
.count { color: var(--muted); font-size: 13px; margin: 4px 2px 8px; }
.deal { background: var(--card); border-radius: 18px; padding: 14px 14px 12px; margin-bottom: 10px;
  display: grid; grid-template-columns: 1fr auto; gap: 3px 14px; border: 1px solid var(--line); }
.deal.watched { border-color: var(--watch); box-shadow: 0 0 0 1px var(--watch) inset; }
.deal.expired { opacity: .5; }
.store { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.store.Tesco { color: var(--tesco); } .store.Billa { color: var(--billa); } .store.Lidl { color: var(--lidl); }
.name { font-weight: 650; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 13px; }
.note { font-size: 13px; color: var(--sale); }
.prices { text-align: right; grid-column: 2; grid-row: 1 / span 3; align-self: start; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.deal > :not(.prices) { grid-column: 1; }
.deal > .actions { grid-column: 1 / -1; }
.price { font: 800 24px/1 var(--display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.old { color: var(--muted); text-decoration: line-through; font-size: 13px; font-variant-numeric: tabular-nums; }
.pct { display: inline-block; background: var(--sale-soft); color: var(--sale); font-weight: 800; font-size: 13px;
  border-radius: 8px; padding: 2px 8px; }
.club { font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 2px 8px; display: inline-block; }
.actions { display: flex; gap: 8px; margin-top: 8px; }
.btn { border: 0; background: var(--raised); border-radius: 12px; padding: 8px 14px; font-size: 14px; font-weight: 600; min-height: 36px; }
.btn.on { background: var(--accent-soft); color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; display: grid; grid-template-columns: repeat(3, 1fr);
  height: calc(var(--tabs-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border-top: 1px solid var(--line); }
nav button { border: 0; background: none; font-size: 13px; font-weight: 600; color: var(--muted); }
nav button[aria-current="page"] { color: var(--accent); }
nav button[aria-current="page"]::before { content: ""; display: block; width: 24px; height: 3px; border-radius: 2px;
  background: var(--accent); margin: 0 auto 6px; }
nav .badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--sale); color: #fff; font-size: 11px; margin-left: 4px; }
.empty { text-align: center; color: var(--muted); padding: 48px 10px; }
.group { font-weight: 700; margin: 16px 2px 8px; display: flex; justify-content: space-between; }
.item { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; }
.item input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.item .grow { flex: 1; min-width: 0; }
.item.done .name { text-decoration: line-through; color: var(--muted); }
.x { border: 0; background: none; color: var(--muted); font-size: 20px; padding: 4px 8px; }
.addrow { display: flex; gap: 8px; margin: 8px 0 14px; }
.addrow input { flex: 1; padding: 12px 14px; border-radius: 14px; border: 1px solid transparent; background: var(--raised); min-width: 0; outline: none; }
.addrow input:focus { border-color: var(--accent); }
.kw { display: inline-flex; align-items: center; gap: 4px; background: var(--watch-soft); border-radius: 999px; padding: 4px 4px 4px 14px; margin: 0 6px 6px 0; font-size: 14px; font-weight: 600; }
.total { text-align: right; color: var(--muted); font-size: 14px; margin-top: 8px; }
.shop { margin-bottom: 4px; }
.price.emp { color: var(--tesco); }
.club.empTag { color: var(--tesco); background: transparent; box-shadow: inset 0 0 0 1px var(--tesco); }
#emp[aria-pressed="true"] { background: var(--tesco); color: #fff; }
.shop > summary { list-style: none; display: flex; align-items: baseline; gap: 10px; padding: 16px 2px 10px; cursor: pointer;
  position: sticky; top: var(--hdr, 0px); z-index: 2;
  background: color-mix(in srgb, var(--bg) 92%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.shop > summary::-webkit-details-marker { display: none; }
.shop > summary .store { font: 800 20px/1 var(--display); letter-spacing: -0.01em; text-transform: none; }
.shop > summary::after { content: "▾"; margin-left: auto; color: var(--muted); transition: transform .15s; }
.shop:not([open]) > summary::after { transform: rotate(-90deg); }
.deal { grid-template-columns: 1fr auto 32px; padding: 11px 10px 11px 14px; margin-bottom: 8px; border-radius: 16px; gap: 2px 10px; align-items: center; }
.deal > .btncol { grid-column: 3; grid-row: 1 / span 3; display: flex; flex-direction: column; gap: 4px; }
.prices { grid-column: 2; gap: 4px; }
.price { font-size: 21px; }
.name { font-size: 15px; }
.oldrow { display: flex; gap: 6px; align-items: center; }
.addbtn { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--raised); color: var(--ink);
  font-size: 20px; font-weight: 600; line-height: 1; display: grid; place-items: center; }
.addbtn.on { background: var(--accent); color: var(--on-accent); font-size: 16px; }
.addbtn.eye.on { background: var(--watch); color: #1a1405; }
.addbtn svg { pointer-events: none; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 3px; }
.unitp { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { font-size: 11px; font-weight: 800; border-radius: 6px; padding: 2px 7px; letter-spacing: .02em; }
.tag.best { background: #1d3b2c; color: #5ee0ae; }
.tag.soon { background: var(--sale-soft); color: var(--sale); }
@media (prefers-color-scheme: light) { .tag.best { background: #d9f6e9; color: #0f8f62; } }
.seg { margin: 10px 0 0; }
.summary { display: flex; justify-content: flex-end; gap: 22px; margin: 14px 2px 4px; }
.summary > div { display: flex; flex-direction: column; align-items: flex-end; }
.summary b { font: 800 22px/1.1 var(--display); }
.summary .savings { color: #5ee0ae; }
@media (prefers-color-scheme: light) { .summary .savings { color: #0f8f62; } }
.group .meta { font-weight: 500; }
.syncbox { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin: 6px 0 10px; }
.syncbox > summary { font-weight: 650; cursor: pointer; list-style: none; }
.syncbox > summary::-webkit-details-marker { display: none; }
.syncbox p { margin: 10px 0 4px; }
.syncbox .code { font-family: ui-monospace, Menlo, monospace; letter-spacing: .03em; user-select: all; }
</style>
</head>
<body>
<header>
  <h1 id="title">Akcie</h1>
  <div class="sub" id="validity">Načítavam…</div>
  <div id="controls">
    <div class="row seg" id="weeks"></div>
    <input class="search" id="q" type="search" placeholder="Hľadať, napr. maslo, kuracie, pivo" autocomplete="off">
    <div class="row" id="stores"></div>
    <div class="row">
      <select class="chip" id="cat" aria-label="Kategória"><option value="">Všetky kategórie</option></select>
      <select class="chip" id="sort" aria-label="Zoradenie">
        <option value="disc">Najväčšia zľava</option>
        <option value="price">Najnižšia cena</option>
        <option value="unit">Najlacnejšie za kg / l</option>
        <option value="name">Podľa názvu</option>
      </select>
      <button class="chip" id="emp" aria-pressed="false">Zamestnanecká karta Tesco −15 %</button>
    </div>
  </div>
</header>
<main id="view"></main>
<nav>
  <button data-tab="deals" aria-current="page">Akcie</button>
  <button data-tab="list">Nákup<span id="listBadge"></span></button>
  <button data-tab="watch">Sledované<span id="watchBadge"></span></button>
</nav>
<script>
const EYE = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
const STORE_CLUB = { Tesco: "Clubcard", Billa: "Bonus", Lidl: "Lidl Plus" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const eur = n => n == null ? "" : n.toFixed(2).replace(".", ",") + " €";
const today = new Date().toISOString().slice(0, 10);
const fmtDate = s => { if (!s) return ""; const [y, m, d] = s.split("-"); return `${+d}.${+m}.`; };

function load(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } }
function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }

const state = {
  data: { deals: [], stores: {} }, tab: "deals",
  week: "now", q: "", stores: new Set(load("akcie.stores", [])), cat: "", sort: load("akcie.sort", "disc"),
  list: load("akcie.list", []), watch: load("akcie.watch", []), emp: load("akcie.emp", false),
};
const EMP_DISCOUNT = 0.15;
// Employee card: 15 % on top of the best card price (Clubcard/coupon price if the deal has one).
const empPrice = d => d.store === "Tesco" && state.emp
  ? Math.round((d.club_price ?? d.price) * (1 - EMP_DISCOUNT) * 100) / 100 : null;
const payPrice = d => empPrice(d) ?? d.price;
const keyOf = d => `${d.store}|${d.name}|${d.price}`;
const isWatched = d => state.watch.some(w => norm(d.name + " " + (d.brand || "")).includes(norm(w)));
const expired = d => d.valid_to && d.valid_to < today;
const tomorrow = new Date(Date.now() + 864e5).toISOString().slice(0, 10);
const isNext = d => d.upcoming && d.valid_from && d.valid_from > today;
const unitPay = d => d.unit_price == null ? null : Math.round(d.unit_price * payPrice(d) / d.price * 100) / 100;
const unitText = d => { const u = unitPay(d); if (u == null) return "";
  return d.unit_basis === "pranie" ? `${eur(u)} / pranie` : `${eur(u)} / ${d.unit_basis}`; };
const endsTag = d => d.valid_to === today ? "končí dnes" : d.valid_to === tomorrow ? "končí zajtra" : "";

// ---------- Shared household (Supabase): shopping list + watch list synced by a secret code
const SB_URL = "https://dlbgfzjgkuwubomihkux.supabase.co";
const SB_KEY = "sb_publishable_mp28D-V0T8ZAHW410MStGw_KWIFq5Dw";
const sync = { code: load("akcie.code", ""), status: "", busy: false, timer: null };
// Deleted items are kept as tombstones for a while so a delete on one phone wins over an old copy on another.
let tomb = load("akcie.tomb", {});            // key -> time of deletion
let watchMeta = load("akcie.watchMeta", {});  // keyword -> time added
const now = () => Date.now();

async function rpc(fn, body) {
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method: "POST", headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}
function localDoc() {
  return {
    list: state.list.map(i => ({ ...i, t: i.t || 0 })),
    watch: state.watch.map(w => ({ w, t: watchMeta[w] || 0 })),
    tomb,
  };
}
function mergeDocs(a, b) {
  const tombs = { ...(a.tomb || {}) };
  for (const [k, t] of Object.entries(b.tomb || {})) tombs[k] = Math.max(tombs[k] || 0, t);
  const weekAgo = now() - 30 * 864e5;
  for (const k of Object.keys(tombs)) if (tombs[k] < weekAgo) delete tombs[k];
  const list = new Map();
  for (const i of [...(a.list || []), ...(b.list || [])]) {
    const cur = list.get(i.key);
    if (!cur || (i.t || 0) > (cur.t || 0)) list.set(i.key, i);
  }
  const watch = new Map();
  for (const w of [...(a.watch || []), ...(b.watch || [])]) {
    const cur = watch.get(w.w);
    if (!cur || (w.t || 0) > (cur.t || 0)) watch.set(w.w, w);
  }
  return {
    list: [...list.values()].filter(i => !(tombs["l:" + i.key] > (i.t || 0))),
    watch: [...watch.values()].filter(w => !(tombs["w:" + w.w] > (w.t || 0))),
    tomb: tombs,
  };
}
function applyDoc(doc) {
  state.list = doc.list; state.watch = doc.watch.map(w => w.w);
  watchMeta = Object.fromEntries(doc.watch.map(w => [w.w, w.t])); tomb = doc.tomb;
  save("akcie.list", state.list); save("akcie.watch", state.watch);
  save("akcie.watchMeta", watchMeta); save("akcie.tomb", tomb);
}
async function syncNow() {
  if (!sync.code || sync.busy) return;
  sync.busy = true;
  try {
    const remote = await rpc("get_household", { p_code: sync.code });
    const merged = mergeDocs(remote?.data || {}, localDoc());
    const changedLocal = JSON.stringify(merged.list) !== JSON.stringify(localDoc().list) ||
                         JSON.stringify(merged.watch.map(w => w.w)) !== JSON.stringify(state.watch);
    applyDoc(merged);
    if (JSON.stringify(merged) !== JSON.stringify(remote?.data || null)) await rpc("save_household", { p_code: sync.code, p_data: merged });
    sync.status = "ok " + new Date().toLocaleTimeString("sk", { hour: "2-digit", minute: "2-digit" });
    if (changedLocal || state.tab === "list") render();
  } catch (e) {
    sync.status = "error"; console.warn("sync failed", e);
    if (state.tab === "list") render();
  } finally { sync.busy = false; }
}
function syncSoon() { clearTimeout(sync.timer); sync.timer = setTimeout(syncNow, 400); }
function newCode() {
  const a = "abcdefghjkmnpqrstuvwxyz23456789", r = crypto.getRandomValues(new Uint8Array(16));
  return [...r].map(x => a[x % a.length]).join("").replace(/(.{4})(?=.)/g, "$1-");
}
function joinCode(c) {
  c = String(c || "").trim().toLowerCase();
  if (c.replace(/-/g, "").length < 12) { alert("Kód je príliš krátky."); return; }
  sync.code = c; save("akcie.code", c); syncNow();
}
const shareLink = () => `${location.origin}${location.pathname}#k=${sync.code}`;
function joinFromLink() { const m = location.hash.match(/k=([a-z0-9-]{12,})/i);
  if (m) { history.replaceState(null, "", location.pathname); if (m[1] !== sync.code && confirm("Pripojiť sa k zdieľanému zoznamu?")) joinCode(m[1]); } }
joinFromLink(); window.addEventListener("hashchange", joinFromLink);
document.addEventListener("visibilitychange", () => { if (!document.hidden) syncNow(); });
setInterval(() => { if (!document.hidden) syncNow(); }, 20000);

function syncPanel() {
  if (!sync.code) return `<details class="syncbox"><summary>👥 Zdieľať zoznam s ďalšími (napr. partnerka)</summary>
    <p class="meta">Nákup aj sledované sa budú synchronizovať medzi všetkými, ktorí majú rovnaký kód.</p>
    <div class="actions"><button class="btn primary" id="syncNew">Vytvoriť zdieľaný zoznam</button></div>
    <form class="addrow" id="joinForm"><input id="joinText" placeholder="alebo zadaj kód, napr. ab12-cd34-…" autocomplete="off">
      <button class="btn">Pripojiť</button></form></details>`;
  const st = sync.status.startsWith("ok") ? `synchronizované ${sync.status.slice(3)}` : sync.status === "error" ? "⚠️ bez pripojenia – skúsim znova" : "synchronizujem…";
  return `<details class="syncbox"><summary>👥 Zdieľaný zoznam · <span class="meta">${st}</span></summary>
    <p class="meta">Kód: <b class="code">${esc(sync.code)}</b></p>
    <div class="actions"><button class="btn primary" id="syncShare">Poslať pozvánku</button><button class="btn" id="syncLeave">Odpojiť</button></div></details>`;
}

async function init() {
  try {
    const r = await fetch("deals.json?v=" + Date.now(), { cache: "no-store" });
    state.data = await r.json();
  } catch (e) {
    $("#validity").textContent = "Nepodarilo sa načítať akcie. Skontroluj pripojenie.";
  }
  const stores = Object.keys(state.data.stores || {}).sort();
  $("#stores").innerHTML = stores.map(s =>
    `<button class="chip shopchip ${esc(s)}" data-store="${esc(s)}" aria-pressed="${state.stores.has(s)}">${esc(s)}</button>`).join("");
  const cats = [...new Set(state.data.deals.map(d => d.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, "sk"));
  $("#cat").innerHTML = `<option value="">Všetky kategórie</option>` + cats.map(c => `<option>${esc(c)}</option>`).join("");
  $("#sort").value = state.sort;
  const nextFrom = Object.values(state.data.stores || {}).map(v => v.next_from).filter(Boolean).sort()[0];
  const hasNext = state.data.deals.some(isNext);
  $("#weeks").innerHTML = hasNext ? `<button class="chip" data-week="now" aria-pressed="true">Tento týždeň</button>
    <button class="chip" data-week="next" aria-pressed="false">Budúci týždeň${nextFrom ? " · od " + fmtDate(nextFrom) : ""}</button>` : "";
  $("#weeks").style.display = hasNext ? "" : "none";
  $("#validity").innerHTML = stores.map(s => {
    const v = state.data.stores[s] || {};
    return `<b class="sname ${esc(s)}">${esc(s)}</b> ${v.valid_from ? fmtDate(v.valid_from) + "–" + fmtDate(v.valid_to) : ""}`;
  }).join(' <span style="opacity:.4">|</span> ') || "Zatiaľ žiadne akcie";
  render();
  syncNow();
}

function filtered() {
  const q = norm(state.q).split(/\s+/).filter(Boolean);
  let list = state.data.deals.filter(d =>
    (state.week === "next" ? isNext(d) : !isNext(d)) &&
    (!state.stores.size || state.stores.has(d.store)) &&
    (!state.cat || d.category === state.cat) &&
    q.every(w => norm(`${d.name} ${d.brand || ""} ${d.unit || ""} ${d.category || ""}`).includes(w)));
  const by = {
    disc: (a, b) => (b.discount ?? -1) - (a.discount ?? -1),
    price: (a, b) => payPrice(a) - payPrice(b),
    name: (a, b) => a.name.localeCompare(b.name, "sk"),
    unit: (a, b) => (unitPay(a) ?? 1e9) - (unitPay(b) ?? 1e9),
  }[state.sort];
  return list.sort((a, b) => (expired(a) - expired(b)) || by(a, b));
}

function dealCard(d, showStore = true) {
  const inList = state.list.some(i => i.key === keyOf(d));
  const sv = state.data.stores?.[d.store] || {};
  const differs = (d.valid_from && d.valid_from !== sv.valid_from) || (d.valid_to && d.valid_to !== sv.valid_to);
  const dates = differs ? `len ${fmtDate(d.valid_from || sv.valid_from)}–${fmtDate(d.valid_to || sv.valid_to)}` : "";
  return `<article class="deal ${isWatched(d) ? "watched" : ""} ${expired(d) ? "expired" : ""}">
    ${showStore || expired(d) ? `<div>${showStore ? `<span class="store ${esc(d.store)}">${esc(d.store)}</span>` : ""}${expired(d) ? ' <span class="meta">skončila</span>' : ""}</div>` : ""}
    <div class="prices">
      ${empPrice(d) != null ? `
        <div class="price emp">${eur(empPrice(d))}</div>
        <div><span class="club empTag">so zam. kartou</span></div>
        <div class="old" style="text-decoration:none">akcia ${eur(d.price)}${d.club_price != null && d.club_price < d.price ? ` · Clubcard ${eur(d.club_price)}` : ""}</div>
        ${d.old_price ? `<div class="oldrow"><span class="old">${eur(d.old_price)}</span><span class="pct">−${Math.round((1 - empPrice(d) / d.old_price) * 100)} %</span></div>` : ""}
      ` : `
        <div class="price">${eur(d.price)}</div>
        ${d.old_price || d.discount ? `<div class="oldrow">${d.old_price ? `<span class="old">${eur(d.old_price)}</span>` : ""}${d.discount ? `<span class="pct">−${d.discount} %</span>` : ""}</div>` : ""}
        ${d.club_price != null && d.club_price < d.price ? `<div><span class="club">${STORE_CLUB[d.store] || "Karta"} ${eur(d.club_price)}</span></div>` : ""}
      `}
    </div>
    <div class="name">${esc(d.name)}</div>
    <div class="meta">${[d.brand, d.unit, dates].filter(Boolean).map(esc).join(" · ")}</div>
    ${unitText(d) || endsTag(d) || state.best?.has(d) ? `<div class="tags">
      ${state.best?.has(d) ? `<span class="tag best">najlacnejšie</span>` : ""}
      ${endsTag(d) ? `<span class="tag soon">${endsTag(d)}</span>` : ""}
      ${unitText(d) ? `<span class="unitp">${unitText(d)}</span>` : ""}</div>` : ""}
    ${d.note ? `<div class="note">${esc(d.note)}</div>` : ""}
    <div class="btncol">
      <button class="addbtn eye ${isWatched(d) ? "on" : ""}" data-watchname="${esc(d.name)}" aria-label="${isWatched(d) ? "Prestať sledovať" : "Sledovať"}">${EYE}</button>
      <button class="addbtn ${inList ? "on" : ""}" data-add="${esc(keyOf(d))}" aria-label="${inList ? "Odobrať z nákupu" : "Pridať do nákupu"}">${inList ? "✓" : "+"}</button>
    </div>
  </article>`;
}

const STORE_ORDER = ["Tesco", "Billa", "Lidl"];
const closed = new Set(load("akcie.closed", []));

function renderDeals() {
  const list = filtered();
  state.best = new Set();
  if (state.q.trim()) {
    const live = list.filter(d => !expired(d) && unitPay(d) != null);
    for (const basis of new Set(live.map(d => d.unit_basis))) {
      const same = live.filter(d => d.unit_basis === basis);
      if (same.length < 2) continue;
      const min = Math.min(...same.map(unitPay));
      same.filter(d => unitPay(d) === min).forEach(d => state.best.add(d));
    }
  }
  const rulesNote = state.data.complete === false || state.data.source === "rules"
    ? `<div class="notice">Nové letáky ešte nie sú spracované naplno – niektoré akcie chýbajú. Úplný zoznam pribudne po týždennom spracovaní.</div>` : "";
  const stores = [...new Set([...STORE_ORDER, ...list.map(d => d.store)])].filter(s => list.some(d => d.store === s));
  const sections = stores.map(s => {
    const items = list.filter(d => d.store === s);
    const v = state.data.stores?.[s] || {};
    const open = state.q || !closed.has(s);
    return `<details class="shop" data-shop="${esc(s)}" ${open ? "open" : ""}>
      <summary><span class="store ${esc(s)}">${esc(s)}</span>
        <span class="meta">${items.length} akcií${state.week === "next"
          ? (v.next_from ? ` · ${fmtDate(v.next_from)}–${fmtDate(v.next_to)}` : "")
          : (v.valid_from ? ` · ${fmtDate(v.valid_from)}–${fmtDate(v.valid_to)}` : "")}</span></summary>
      ${items.map(d => dealCard(d, false)).join("")}
    </details>`;
  }).join("");
  $("#view").innerHTML = rulesNote + (sections || `<div class="empty">Nič sa nenašlo.</div>`);
}

function renderList() {
  const groups = {};
  state.list.forEach(i => (groups[i.store || "Vlastné"] ??= []).push(i));
  const open = state.list.filter(i => !i.done && i.price);
  const sum = items => items.reduce((s, i) => s + i.price, 0);
  const saved = items => items.reduce((s, i) => s + (i.old_price ? i.old_price - i.price : 0), 0);
  const order = [...STORE_ORDER, "Vlastné"].filter(g => groups[g]).concat(Object.keys(groups).filter(g => ![...STORE_ORDER, "Vlastné"].includes(g)));
  $("#view").innerHTML = syncPanel() + `
    <form class="addrow" id="addForm"><input id="addText" placeholder="Pridať vlastnú položku" autocomplete="off">
      <button class="btn primary">Pridať</button></form>
    ${order.map(g => {
      const left = groups[g].filter(i => !i.done && i.price);
      return `<div class="group"><span class="store ${esc(g)}">${esc(g)}</span>
        ${left.length ? `<span class="meta">${eur(sum(left))}${saved(left) > 0.005 ? ` · ušetríš ${eur(saved(left))}` : ""}</span>` : ""}</div>` +
      groups[g].map(i => `<label class="item ${i.done ? "done" : ""}">
        <input type="checkbox" data-done="${esc(i.key)}" ${i.done ? "checked" : ""}>
        <div class="grow"><div class="name">${esc(i.name)}</div>
          ${i.price ? `<div class="meta">${eur(i.price)}${i.old_price ? ` <s>${eur(i.old_price)}</s>` : ""}${i.unit ? " · " + esc(i.unit) : ""}</div>` : ""}</div>
        <button class="x" data-del="${esc(i.key)}" aria-label="Odstrániť">×</button></label>`).join("");
    }).join("")
      || `<div class="empty">Nákupný zoznam je prázdny.<br>Pridaj akcie tlačidlom +.</div>`}
    ${state.list.length ? `<div class="summary">
        <div><span class="meta">Spolu</span><b>${eur(sum(open))}</b></div>
        ${saved(open) > 0.005 ? `<div><span class="meta">Ušetríš</span><b class="savings">${eur(saved(open))}</b></div>` : ""}
      </div>
      <div class="actions" style="justify-content:flex-end">
        <button class="btn" id="clearDone">Vymazať kúpené</button>
        <button class="btn primary" id="shareList">Zdieľať zoznam</button>
      </div>` : ""}`;
}

function listText() {
  const groups = {};
  state.list.filter(i => !i.done).forEach(i => (groups[i.store || "Vlastné"] ??= []).push(i));
  return "Nákup:\n" + Object.entries(groups).map(([g, items]) =>
    `\n${g}\n` + items.map(i => `• ${i.name}${i.unit ? ` (${i.unit})` : ""}${i.price ? ` – ${eur(i.price)}` : ""}`).join("\n")).join("\n");
}

function renderWatch() {
  const matches = state.data.deals.filter(d => !expired(d) && !isNext(d) && isWatched(d));
  const soon = state.data.deals.filter(d => isNext(d) && isWatched(d));
  $("#view").innerHTML = syncPanel() + `
    <p class="meta">Napíš, čo bežne kupuješ. Keď je to v akcii, zvýrazní sa to v zozname akcií.</p>
    <form class="addrow" id="watchForm"><input id="watchText" placeholder="napr. maslo, Pilsner, kuracie prsia" autocomplete="off">
      <button class="btn primary">Sledovať</button></form>
    <div>${state.watch.map(w => `<span class="kw">${esc(w)}<button class="x" data-unwatch="${esc(w)}" aria-label="Prestať sledovať">×</button></span>`).join("")}</div>
    <div class="group">Tento týždeň v akcii (${matches.length})</div>
    ${matches.map(dealCard).join("") || `<div class="empty">${state.watch.length ? "Nič zo sledovaného nie je teraz v akcii." : "Zatiaľ nič nesleduješ."}</div>`}
    ${soon.length ? `<div class="group">Budúci týždeň (${soon.length})</div>${soon.map(dealCard).join("")}` : ""}`;
}

function render() {
  $("#controls").style.display = state.tab === "deals" ? "" : "none";
  ({ deals: renderDeals, list: renderList, watch: renderWatch })[state.tab]();
  const open = state.list.filter(i => !i.done).length;
  $("#listBadge").innerHTML = open ? `<span class="badge">${open}</span>` : "";
  const hits = state.data.deals.filter(d => !expired(d) && !isNext(d) && isWatched(d)).length;
  $("#watchBadge").innerHTML = hits ? `<span class="badge">${hits}</span>` : "";
  document.querySelectorAll("nav button").forEach(b => b.toggleAttribute("aria-current", b.dataset.tab === state.tab));
  document.querySelectorAll("nav button[aria-current]").forEach(b => b.setAttribute("aria-current", "page"));
}

$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("#emp").setAttribute("aria-pressed", state.emp);
$("#emp").addEventListener("click", e => {
  state.emp = !state.emp; save("akcie.emp", state.emp);
  e.target.setAttribute("aria-pressed", state.emp); render();
});
$("#weeks").addEventListener("click", e => {
  const w = e.target.dataset.week; if (!w) return;
  state.week = w;
  document.querySelectorAll("#weeks .chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.week === w));
  render();
});
$("#cat").addEventListener("change", e => { state.cat = e.target.value; render(); });
$("#sort").addEventListener("change", e => { state.sort = e.target.value; save("akcie.sort", state.sort); render(); });
$("#stores").addEventListener("click", e => {
  const s = e.target.dataset.store; if (!s) return;
  state.stores.has(s) ? state.stores.delete(s) : state.stores.add(s);
  e.target.setAttribute("aria-pressed", state.stores.has(s));
  save("akcie.stores", [...state.stores]); render();
});
document.querySelector("nav").addEventListener("click", e => {
  const t = e.target.closest("button")?.dataset.tab; if (!t) return;
  state.tab = t; render(); window.scrollTo(0, 0);
});
$("#view").addEventListener("click", e => {
  const t = e.target;
  if (t.dataset.add) {
    const i = state.list.findIndex(x => x.key === t.dataset.add);
    if (i >= 0) { tomb["l:" + state.list[i].key] = now(); state.list.splice(i, 1); save("akcie.tomb", tomb); }
    else {
      const d = state.data.deals.find(d => keyOf(d) === t.dataset.add);
      state.list.push({ key: keyOf(d), name: d.name, store: d.store, price: payPrice(d), old_price: d.old_price, unit: d.unit, done: false, t: now() });
    }
    save("akcie.list", state.list); render(); syncSoon();
  } else if (t.dataset.watchname) {
    const d = state.data.deals.find(x => x.name === t.dataset.watchname);
    if (d && isWatched(d)) state.watch = state.watch.filter(w => {
      const hit = norm(d.name + " " + (d.brand || "")).includes(norm(w)); if (hit) tomb["w:" + w] = now(); return !hit; });
    else { state.watch.push(t.dataset.watchname); watchMeta[t.dataset.watchname] = now(); }
    save("akcie.watch", state.watch); save("akcie.watchMeta", watchMeta); save("akcie.tomb", tomb); render(); syncSoon();
  } else if (t.dataset.del) {
    e.preventDefault();
    tomb["l:" + t.dataset.del] = now();
    state.list = state.list.filter(i => i.key !== t.dataset.del); save("akcie.list", state.list); save("akcie.tomb", tomb); render(); syncSoon();
  } else if (t.dataset.unwatch) {
    tomb["w:" + t.dataset.unwatch] = now();
    state.watch = state.watch.filter(w => w !== t.dataset.unwatch); save("akcie.watch", state.watch); save("akcie.tomb", tomb); render(); syncSoon();
  } else if (t.id === "shareList") {
    const text = listText();
    if (navigator.share) navigator.share({ text }).catch(() => {});
    else navigator.clipboard?.writeText(text).then(() => { t.textContent = "Skopírované ✓"; setTimeout(() => t.textContent = "Zdieľať zoznam", 1500); });
  } else if (t.id === "clearDone") {
    state.list.filter(i => i.done).forEach(i => tomb["l:" + i.key] = now());
    state.list = state.list.filter(i => !i.done); save("akcie.list", state.list); save("akcie.tomb", tomb); render(); syncSoon();
  } else if (t.id === "syncNew") {
    joinCode(newCode());
  } else if (t.id === "syncLeave") {
    if (confirm("Odpojiť tento telefón od zdieľaného zoznamu? Položky ostanú v telefóne.")) { sync.code = ""; save("akcie.code", ""); render(); }
  } else if (t.id === "syncShare") {
    const text = `Pridaj sa k nášmu nákupnému zoznamu v appke Akcie: ${shareLink()}`;
    if (navigator.share) navigator.share({ text }).catch(() => {});
    else navigator.clipboard?.writeText(text).then(() => { t.textContent = "Skopírované ✓"; });
  }
});
$("#view").addEventListener("toggle", e => {
  const s = e.target.dataset?.shop; if (!s || state.q) return;
  e.target.open ? closed.delete(s) : closed.add(s);
  save("akcie.closed", [...closed]);
}, true);
const setHeaderHeight = () => document.documentElement.style.setProperty("--hdr", $("header").offsetHeight + "px");
new ResizeObserver(setHeaderHeight).observe($("header"));
$("#view").addEventListener("change", e => {
  const k = e.target.dataset.done; if (!k) return;
  const i = state.list.find(i => i.key === k); i.done = e.target.checked; i.t = now();
  save("akcie.list", state.list); render(); syncSoon();
});
$("#view").addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "joinForm") { joinCode($("#joinText").value); return render(); }
  if (e.target.id === "addForm") {
    const v = $("#addText").value.trim(); if (!v) return;
    state.list.push({ key: "own|" + v + "|" + Date.now(), name: v, store: "Vlastné", price: null, done: false, t: now() });
    save("akcie.list", state.list); syncSoon();
  } else if (e.target.id === "watchForm") {
    const v = $("#watchText").value.trim(); if (!v || state.watch.includes(v)) return;
    state.watch.push(v); watchMeta[v] = now(); save("akcie.watch", state.watch); save("akcie.watchMeta", watchMeta); syncSoon();
  }
  render();
});
init();
</script>
</body>
</html>
