name: Stiahnuť letáky

on:
  schedule:
    - cron: "17 5 * * *"   # every morning ~06:17 Bratislava: Kaufland daily offers; unchanged flyers are reused, so no extra AI work
  workflow_dispatch: {}    # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: letaky
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install poppler (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils && (pip install -q --break-system-packages beautifulsoup4 || pip install -q beautifulsoup4)

      - name: Keep Supabase awake (free projects pause after 7 days without activity)
        continue-on-error: true
        run: |
          curl -sS -m 20 -o /dev/null -w "Supabase: HTTP %{http_code}\n" \
            -X POST "https://dlbgfzjgkuwubomihkux.supabase.co/rest/v1/rpc/get_household" \
            -H "apikey: sb_publishable_mp28D-V0T8ZAHW410MStGw_KWIFq5Dw" \
            -H "Content-Type: application/json" -d '{"p_code":"keepalive"}'

      - name: Download flyers and extract text
        run: python3 scripts/fetch.py

      - name: Commit
        run: |
          git config user.name "akcie-bot"
          git config user.email "akcie-bot@users.noreply.github.com"
          git add weeks docs/deals.json docs/history.json
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Letáky $(date +%Y-%m-%d)"
          git push

      - name: Publish page images to the "stranky" branch (replaced every week)
        run: |
          WEEK=$(ls -d weeks/*/ | sort | tail -1)
          mkdir -p /tmp/stranky && cp -r "$WEEK" /tmp/stranky/
          cd /tmp/stranky
          find . -name '*.txt' -delete
          git init -q -b stranky
          git config user.name "akcie-bot"
          git config user.email "akcie-bot@users.noreply.github.com"
          git add -A && git commit -qm "Obrázky strán $(basename $WEEK)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" stranky
